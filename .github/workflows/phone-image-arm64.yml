name: First-install Debian image ARM64

on:
  push:
    branches: ['build/phone-rootfs-*']
    paths:
      - '.github/workflows/phone-image-arm64.yml'
      - 'tools/ci/phone-image-cloud.py'
      - 'tools/install/**'
      - '.ci-inputs/phone-rootfs/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: phone-rootfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reclaim unused hosted SDKs, never local device storage
        run: python3 -B tools/ci/prepare-runner-storage.py
      - name: Verify native VM, source and image admission regressions
        run: |
          python3 -B tools/ci/phone-image-cloud.py preflight
          python3 -B tools/ci/check-source-integrity.py
          python3 -B -m unittest discover -s tests -p test_gnu_cloud_import.py -v
          python3 -B -m unittest discover -s tests -p test_local_image_build.py -v
          python3 -B -m unittest discover -s tests -p test_phone_image_cloud.py -v
      - name: Install ordinary native Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debootstrap arch-test \
            qemu-user-static debian-archive-keyring gnupg gpgv debsig-verify \
            ca-certificates xz-utils gzip util-linux binutils
      - name: Restore exact verified client download cache
        id: client
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/ci/cache/phone-inputs
          key: phone-official-arm64-26.1103.31037-4dd0a44712e0fa58
      - name: Fetch already-built GNU artifact without recompiling
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/ci/phone
          gh api "repos/$GH_REPO/actions/artifacts/14044448020/zip" > work/ci/phone/gnu-runtime.zip
      - name: Admit exact GNU, Mesa and signed official client inputs
        run: python3 -B tools/ci/phone-image-cloud.py prepare
      - name: Build and verify authenticated Debian 13 base natively
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_RUN_ID \
            python3 -B tools/ci/phone-image-cloud.py base
      - name: Configure pristine desktop image in private native mount namespaces
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_RUN_ID \
            python3 -B tools/ci/phone-image-cloud.py image
      - name: Verify matched image and split transport parts below 512 MiB
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_RUN_ID \
            python3 -B tools/ci/phone-image-cloud.py export
      - name: Preserve verified downloads for retry, never trust cache without checks
        if: always() && steps.client.outcome == 'success' && steps.client.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/ci/cache/phone-inputs
          key: ${{ steps.client.outputs.cache-primary-key }}
      - name: Retain image metadata and failure diagnostics, not homes or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-image-metadata-${{ github.run_id }}
          path: |
            work/ci/phone-transfer/metadata
            work/ci/evidence/phone-cloud
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Upload image part 00
        if: success() && hashFiles('work/ci/phone-transfer/parts/part-00') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-rootfs-${{ github.run_id }}-part-00
          path: work/ci/phone-transfer/parts/part-00
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload image part 01
        if: success() && hashFiles('work/ci/phone-transfer/parts/part-01') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-rootfs-${{ github.run_id }}-part-01
          path: work/ci/phone-transfer/parts/part-01
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload image part 02
        if: success() && hashFiles('work/ci/phone-transfer/parts/part-02') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-rootfs-${{ github.run_id }}-part-02
          path: work/ci/phone-transfer/parts/part-02
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload image part 03
        if: success() && hashFiles('work/ci/phone-transfer/parts/part-03') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-rootfs-${{ github.run_id }}-part-03
          path: work/ci/phone-transfer/parts/part-03
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload image part 04
        if: success() && hashFiles('work/ci/phone-transfer/parts/part-04') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-rootfs-${{ github.run_id }}-part-04
          path: work/ci/phone-transfer/parts/part-04
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload image part 05
        if: success() && hashFiles('work/ci/phone-transfer/parts/part-05') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-rootfs-${{ github.run_id }}-part-05
          path: work/ci/phone-transfer/parts/part-05
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload image part 06
        if: success() && hashFiles('work/ci/phone-transfer/parts/part-06') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-rootfs-${{ github.run_id }}-part-06
          path: work/ci/phone-transfer/parts/part-06
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload image part 07
        if: success() && hashFiles('work/ci/phone-transfer/parts/part-07') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-rootfs-${{ github.run_id }}-part-07
          path: work/ci/phone-transfer/parts/part-07
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
